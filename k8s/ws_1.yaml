apiVersion: v1
kind: Namespace
metadata:
  name: ws1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws1-app
  namespace: ws1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ws1-app
  template:
    metadata:
      labels:
        app: ws1-app
    spec:
      containers:
      - name: ws1-app
        image: nginx:1.21
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ws1-svc
  namespace: ws1
spec:
  type: ClusterIP
  selector:
    app: ws1-app
  ports:
  - port: 80
    targetPort: 80
