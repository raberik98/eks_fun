apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws1-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ws1-app
  template:
    metadata:
      labels:
        app: ws1-app
    spec:
      containers:
      - name: ws1-app
        image: nginx:1.21
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ws1-svc
spec:
  type: NodePort
  selector:
    app: ws1-app
  ports:
  - port: 80
    targetPort: 80
---
# Supported annotations
# https://kubernetes-sigs.github.io/aws-load-balancer-controller/v2.7/guide/ingress/annotations/
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ws1-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: instance
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ws1-svc
                port:
                  number: 80

